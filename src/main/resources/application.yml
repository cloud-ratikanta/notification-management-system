spring:
  application:
    name: notification-management-service
  profiles:
    default: acceptance

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

notification:
  worker:
    enabled: true
    fixed-delay-ms: 1000
  channels:
    slack:
      enabled: false
  dedup:
    window-seconds: 86400
    include-event-id: false
    include-title: true
    include-body: true
    include-template-params: true
  idempotency:
    ttl-seconds: 86400
  retry:
    max-attempts: 5
    base-delay-ms: 1000
    max-delay-ms: 300000
